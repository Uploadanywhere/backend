[project]
name = "uploadanywhere"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "asyncpg-stubs==0.30.2",
    "cryptography==45.0.6",
    "dishka==1.6.0",
    "editorconfig==0.17.1",
    "environs==14.3.0",
    "hatchling>=1.27.0",
    "httpx==0.28.1",
    "litestar[standard]==2.17.0",
    "msgspec>=0.19",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30.2",
    "dotenv-linter>=0.7.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-deadfixtures>=2.2.1",
    "pytest-env>=1.1.5",
    "pytest-freezer>=0.4.9",
    "pytest-mock>=3.14.1",
    "pytest-randomly>=3.16.0",
    "pytest-xdist>=3.8.0",
    "faker==37.5.3",
]

[project.scripts]
uploadanywhere = "uploadanywhere:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
python_files = "tests/**/*.py"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Import of deprecated import 'litestar.contrib.attrs.AttrsSchemaPlugin':DeprecationWarning",
  "ignore:.*container.context.*:DeprecationWarning",
]
markers = []

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "venv",
    "**/migrations/**",
]

line-length = 120
target-version = "py313"
preview = true

[tool.ruff.lint]
select = [
  "F", "E", "W", "C90", "I", "N", "UP", "YTT", "ANN", "ASYNC", "S",
  "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "EM", "T10", "EXE", "FA",
  "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF",
  "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "FIX", "ERA", "PD",
  "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF",
]
ignore = ["ANN101", "ANN401", "ANN102", "S101", "TRY003", "RUF012", "FBT001", "COM819", "COM812", "W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003", "ISC001", "ISC002", "PLR6301", "EM101", "EM102", "UP043"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001", "PLR2004", "S106", "ARG002"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = "."
namespace_packages = true
explicit_package_bases = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["call-overload", "index", "union-attr"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  "class .*\\bProtocol\\):",
  "class .*\\bt.Protocol\\):",
]
