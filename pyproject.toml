[project]
name = "uploadanywhere"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "asyncpg>=0.32.0",
    "asyncpg-stubs==0.32.0",
    "cryptography==50.0.2",
    "dishka==1.10.1",
    "editorconfig==0.17.1",
    "environs==15.2.0",
    "hatchling>=1.27.0",
    "httpx==0.29.0",
    "litestar[standard]==2.25.0",
    "msgspec>=0.22",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "dotenv-linter>=0.7.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-deadfixtures>=4.0.0",
    "pytest-env>=1.1.5",
    "pytest-freezer>=0.4.9",
    "pytest-mock>=3.17.0",
    "pytest-randomly>=3.16.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
    "faker==40.63.0",
]

[project.scripts]
uploadanywhere = "uploadanywhere:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
python_files = "tests/**/*.py"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Import of deprecated import 'litestar.contrib.attrs.AttrsSchemaPlugin':DeprecationWarning",
  "ignore:.*container.context.*:DeprecationWarning",
]
markers = []

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "venv",
    "**/migrations/**",
]

line-length = 120
target-version = "py315"
preview = true

[tool.ruff.lint]
select = [
  "F", "E", "W", "C90", "I", "N", "UP", "YTT", "ANN", "ASYNC", "S",
  "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "EM", "T10", "EXE", "FA",
  "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF",
  "SLOT", "SIM", "TID", "TC", "INT", "ARG", "PTH", "FIX", "ERA", "PD",
  "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF",
]
ignore = ["any-type", "assert", "raise-vanilla-args", "mutable-class-default", "boolean-type-hint-positional-argument", "prohibited-trailing-comma", "missing-trailing-comma", "tab-indentation", "indentation-with-invalid-multiple", "indentation-with-invalid-multiple-comment", "over-indented", "docstring-tab-indentation", "triple-single-quotes", "bad-quotes-inline-string", "bad-quotes-multiline-string", "bad-quotes-docstring", "avoidable-escaped-quote", "single-line-implicit-string-concatenation", "multi-line-implicit-string-concatenation", "no-self-use", "raw-string-in-exception", "f-string-in-exception", "unnecessary-default-type-args", "typing-only-first-party-import", "typing-only-third-party-import", "typing-only-standard-library-import", "yield-in-context-manager-in-async-generator"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["private-member-access", "magic-value-comparison", "hardcoded-password-func-arg", "unused-method-argument"]
"tests/core/utils.py" = ["unconventional-import-alias"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.mypy]
python_version = "3.15"
mypy_path = "src"
files = "."
namespace_packages = true
explicit_package_bases = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["call-overload", "index", "union-attr"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  "class .*\\bProtocol\\):",
  "class .*\\bt.Protocol\\):",
]
